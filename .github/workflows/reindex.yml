
name: Hourly Site Re-indexing

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-n-craft-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate and Prepare Files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public

          # Restore root-level redirects if present.
          if [ ! -f public/_redirects ] && [ -f _redirects ]; then
            cp _redirects public/_redirects
          fi

          # Never deploy without original redirect rules.
          if [ ! -s public/_redirects ]; then
            echo "::error::public/_redirects is missing or empty."
            echo "Upload your original redirect rules before deploying."
            exit 1
          fi

          RULE_COUNT=$(grep -cvE '^[[:space:]]*(#.*)?$' public/_redirects || true)

          if [ "$RULE_COUNT" -eq 0 ] || [ "$RULE_COUNT" -gt 2100 ]; then
            echo "::error::Invalid Cloudflare Pages redirect rule count: $RULE_COUNT"
            exit 1
          fi

          # Prepare the IndexNow key file.
          KEY_FILE="7474419b209041c3864e1f767719f56c.txt"

          if [ -f "$KEY_FILE" ]; then
            cp "$KEY_FILE" "public/$KEY_FILE"
          fi

          if [ ! -s "public/$KEY_FILE" ]; then
            echo "::error::IndexNow verification key file is missing."
            exit 1
          fi

          echo "Redirect rules validated: $RULE_COUNT"

      - name: Generate Sitemap
        run: node build-sitemap.js

      - name: Verify Deployment Output
        shell: bash
        run: |
          set -euo pipefail

          test -s public/sitemap.xml
          test -s public/_redirects
          test -s public/7474419b209041c3864e1f767719f56c.txt

          echo "Sitemap, redirects and IndexNow key are present."

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy public \
            --project-name=code-n-craft \
            --commit-dirty=true

      - name: Run IndexNow Ping
        run: node ping-indexnow.js
