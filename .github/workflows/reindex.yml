name: Hourly Site Re-indexing

on:
  schedule:
    - cron: '0 * * * *' # Har ghante on the hour chalega
  workflow_dispatch: # Manual run button ke liye

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Sitemap Builder
        run: node build-sitemap.js

      - name: Run IndexNow Ping
        run: node ping-indexnow.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy public --project-name=code-n-craft --commit-dirty=true
