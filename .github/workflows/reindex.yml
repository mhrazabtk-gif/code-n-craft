
name: Hourly Site Re-indexing

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-n-craft-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Deployment and Protect Redirects
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public

          # Recover root-level redirects if they exist.
          if [ ! -f public/_redirects ] && [ -f _redirects ]; then
            cp _redirects public/_redirects
          fi

          # Never deploy without the original rules.
          if [ ! -s public/_redirects ]; then
            echo "::error::public/_redirects is missing."
            echo "Restore your original redirect rules before deploying."
            exit 1
          fi

          # Count active redirect rules.
          RULE_COUNT=$(grep -cvE '^[[:space:]]*(#.*)?$' public/_redirects || true)

          if [ "$RULE_COUNT" -eq 0 ] || [ "$RULE_COUNT" -gt 2100 ]; then
            echo "::error::Invalid redirect count: $RULE_COUNT"
            exit 1
          fi

          # Publish the existing IndexNow key used by ping-indexnow.js.
          KEY="7474419b209041c3864e1f767719f56c"
          KEY_FILE="${KEY}.txt"

          if [ -f "$KEY_FILE" ]; then
            cp "$KEY_FILE" "public/$KEY_FILE"
          elif [ -f "public/$KEY_FILE" ]; then
            :
          else
            printf '%s' "$KEY" > "public/$KEY_FILE"
          fi

          echo "Redirect rules preserved: $RULE_COUNT"

      - name: Generate Sitemap
        run: node build-sitemap.js

      - name: Verify Deployment Files
        shell: bash
        run: |
          set -euo pipefail

          test -s public/sitemap.xml
          test -s public/_redirects
          test -s public/7474419b209041c3864e1f767719f56c.txt

          RULE_COUNT=$(grep -cvE '^[[:space:]]*(#.*)?$' public/_redirects || true)

          if [ "$RULE_COUNT" -eq 0 ] || [ "$RULE_COUNT" -gt 2100 ]; then
            echo "::error::Redirect validation failed."
            exit 1
          fi

          echo "Sitemap, redirects and IndexNow key verified."

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy public \
            --project-name=code-n-craft \
            --commit-dirty=true

      - name: Run IndexNow Ping
        run: node ping-indexnow.js
